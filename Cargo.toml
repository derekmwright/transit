[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/audio-bench", "xtask"]
default-members = ["crates/*", "apps/*", "tools/audio-bench", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/transit-audio/transit"

[workspace.dependencies]
# internal
soundcraft-time = { path = "crates/time" }
transit-rt = { path = "crates/rt" }
soundcraft-audio-io = { path = "crates/audio-io" }
transit-audio-backend = { path = "crates/audio-backend" }
transit-audio-wasapi = { path = "crates/audio-wasapi" }
transit-audio-asio = { path = "crates/audio-asio" }
transit-midi-io = { path = "crates/midi-io" }
soundcraft-midi = { path = "crates/midi" }
soundcraft-video = { path = "crates/video" }
soundcraft-dsp = { path = "crates/dsp" }
soundcraft-clap-host = { path = "crates/clap-host" }
soundcraft-asio-panel = { path = "crates/asio-panel" }
soundcraft-vst3-host = { path = "crates/vst3-host" }
soundcraft-au-host = { path = "crates/au-host" }
transit-plugin-host = { path = "crates/plugin-host" }
soundcraft-model = { path = "crates/model" }
soundcraft-mix = { path = "crates/mix" }
soundcraft-engine = { path = "crates/engine" }
soundcraft-playback = { path = "crates/playback" }
soundcraft-automation = { path = "crates/automation" }
soundcraft-ui-egui = { path = "crates/ui-egui" }
transit-ui-studio = { path = "crates/ui-studio" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
getrandom = "0.3"
rayon = "1"
proptest = "1"

# audio
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
rustfft = "6"
# Session bundles (one file holding a session and its audio, for the browser): stored entries only.
zip = { version = "9", default-features = false }
cpal = "=0.16.0"
# Publication protocol depends on bounded single-element push/pop; review every version bump.
rtrb = "=0.4.0"
# Latest clock-state publication uses a bounded swap, never a retry loop; review every bump.
triple_buffer = "=9.0.0"
# MIDI device transport (transit-midi-io). Pinned: the input callback contract is reviewed per bump.
midir = "=0.10.4"

# Which file paths stored in a session may be opened.
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# Windows SDK versions are shared; each consumer selects only the APIs it uses.
windows-sys = "0.61"
asio-sys = "0.2"

# ui
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# SVG icons (Lucide), rasterized once per size by resvg.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
resvg = { version = "0.45.1", default-features = false }
rfd = "0.17"
# The new-version check (apps/transit, feature update-check): a blocking HTTPS client on rustls, no OpenSSL.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# Reviewed WASAPI lifetime (upstream PR #1406), fork-only worker observation and signed timestamp fixes.
cpal = { git = "https://github.com/derekmwright/cpal", rev = "31b5dd4d0bcd4b38924cea42e991dbae87f84479" }
