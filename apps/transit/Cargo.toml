[package]
name = "transit"
description = "transit desktop app: the studio UI over the engine"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundcraft-playback's `asio` feature).
asio = ["soundcraft-playback/asio"]
# The native WASAPI backend (ADR 0016): the "Native WASAPI (experimental)" choice in Audio Devices.
native-wasapi = ["soundcraft-playback/native-wasapi"]
# The native ASIO backend (no SDK): the "Native ASIO (experimental)" choice when Audio system is ASIO.
native-asio = ["soundcraft-playback/native-asio"]

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
transit-ui-studio.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true
soundcraft-automation.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for transit.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
