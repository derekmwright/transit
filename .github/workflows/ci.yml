# The push gate (issue #4): clippy, tests and the layer check on every pull request and every push
# to main, on Windows (default WASAPI, native WASAPI, ASIO), Linux and macOS, plus the web build.
# Hardware tests are #[ignore]d and never run here (docs/contributing/evidence/hardware-and-ci.md).
# release.yml and rt.yml still run on tags; rt.yml also runs on pushes and pull requests that touch
# the realtime crates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (wasapi, native-wasapi)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows
      - name: Tooling script checks
        shell: pwsh
        run: ./xtask/tests/tooling.ps1
      - run: cargo xtask layers
      - run: cargo xtask assets
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p soundcraft-clap-host -p soundcraft-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets --features transit/native-wasapi,transit/native-asio -- -D warnings
      - run: cargo test --locked --workspace --features transit/native-wasapi,transit/native-asio

  # ASIO needs Steinberg's SDK, which asio-sys downloads during the build (or ASIO_SDK_URL supplies).
  # A failed download must not block a merge, so this job reports without gating.
  windows-asio:
    name: windows (asio)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-asio
      # asio-sys needs libclang for bindgen. windows-latest has LLVM in C:\Program Files\LLVM. Pin the
      # MSVC ABI as docs/building.md describes (otherwise a MinGW libclang yields E0080 layout errors).
      - name: ASIO build environment
        shell: pwsh
        env:
          # Optional repository secret: a URL of the ASIO SDK zip the owner hosts. Leave it unset to
          # let asio-sys download the SDK itself (https://www.steinberg.net/asiosdk).
          ASIO_SDK_URL: ${{ secrets.ASIO_SDK_URL }}
        run: |
          ./tools/build-asio.ps1 -SetupOnly -GitHubEnvironment
      - run: cargo clippy --locked -p transit -p audio-bench --all-targets --features transit/asio,transit/native-wasapi,audio-bench/asio -- -D warnings
      - run: cargo test --locked -p soundcraft-playback -p audio-bench --features soundcraft-playback/asio,audio-bench/asio

  linux:
    name: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config mesa-vulkan-drivers libvulkan1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux
      - name: Packaging version checks
        run: bash xtask/tests/packaging-version.sh
      - run: cargo fmt --all -- --check
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p soundcraft-clap-host -p soundcraft-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The egui_kittest tests render with wgpu; the runner has no GPU, so use Mesa's CPU Vulkan
      # driver (lavapipe). Both variables are set because Vulkan loaders honor either name.
      - name: Test
        run: cargo test --locked --workspace
        env:
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  # crates/au-host and the objc2 code in crates/vst3-host compile only here.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p soundcraft-clap-host -p soundcraft-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  wasm:
    name: wasm
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wasm
      - run: cargo xtask wasm
