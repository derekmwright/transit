# ADR 0013, 5: transit-rt (the one crate with unsafe) and the mix crate that calls it are
# linted and tested on every platform it has code for, with and without the portable fallback.
name: Realtime (rt)

# Runs only for release tags and on demand: GitHub Actions minutes are limited.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rt:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-latest }
          - { name: macos-aarch64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
        shell: bash
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: clippy (rt)
        run: cargo clippy -p transit-rt --all-targets -- -D warnings
      - name: clippy (rt, force-fallback)
        run: cargo clippy -p transit-rt --all-targets --features force-fallback -- -D warnings
      - name: clippy (mix)
        run: cargo clippy -p soundcraft-mix --all-targets -- -D warnings
      - name: test
        run: cargo test -p transit-rt -p soundcraft-mix
      - name: test (rt, force-fallback)
        run: cargo test -p transit-rt --features force-fallback
      # Without privileges SCHED_FIFO is refused: the rt tests accept Denied(EPERM) there. Under
      # sudo the same tests must get SCHED_FIFO (SOUNDCRAFT_RT_EXPECT_PROMOTED=1).
      - name: test (rt, Linux, SCHED_FIFO under sudo)
        if: runner.os == 'Linux'
        run: |
          cargo test -p transit-rt --no-run
          sudo -E env "PATH=$PATH" SOUNDCRAFT_RT_EXPECT_PROMOTED=1 cargo test -p transit-rt
