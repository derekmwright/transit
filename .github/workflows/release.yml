# Builds transit for Windows, macOS and Linux and attaches the archives to the GitHub Release for
# the tag. Everything is unsigned: macOS is ad-hoc signed by the linker only. Windows ships two zips:
# transit-<ver>-windows-x86_64-asio (ASIO + native WASAPI) and transit-<ver>-windows-x86_64 (WASAPI
# only, the fallback). Distributing the ASIO build is subject to Steinberg's ASIO SDK license, which
# the project owner handles; see docs/building.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64-asio, os: windows-latest, asio: true, features: "--features transit/asio,transit/native-wasapi" }
          - { name: windows-x86_64, os: windows-latest, asio: false, features: "" }
          - { name: macos-arm64, os: macos-14 }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # asio-sys needs libclang for bindgen. windows-latest has LLVM in C:\Program Files\LLVM. Pin the
      # MSVC ABI as docs/building.md describes (otherwise a MinGW libclang yields E0080 layout errors).
      - name: ASIO build environment
        if: matrix.asio
        shell: pwsh
        env:
          # Optional repository secret: a URL of the ASIO SDK zip the owner hosts. Leave it unset to
          # let asio-sys download the SDK itself (https://www.steinberg.net/asiosdk).
          ASIO_SDK_URL: ${{ secrets.ASIO_SDK_URL }}
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) { throw "LLVM not found at $llvm" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          "CLANG_PATH=$llvm\clang.exe" >> $env:GITHUB_ENV
          "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
          $llvm >> $env:GITHUB_PATH
          if ($env:ASIO_SDK_URL) {
            $zip = Join-Path $env:RUNNER_TEMP 'asio_sdk.zip'
            $dst = Join-Path $env:RUNNER_TEMP 'asio_sdk_unpacked'
            Invoke-WebRequest -Uri $env:ASIO_SDK_URL -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            # The Steinberg zip holds one top-level folder (asiosdk_*); CPAL_ASIO_DIR is that folder.
            $sdk = Get-ChildItem $dst -Directory | Select-Object -First 1
            if (-not (Test-Path (Join-Path $sdk.FullName 'common'))) { throw "ASIO SDK layout unexpected in $dst" }
            "CPAL_ASIO_DIR=$($sdk.FullName)" >> $env:GITHUB_ENV
          }
      - name: Build
        run: cargo build -p transit --release ${{ matrix.features }}
      - name: Package version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "name=transit-${v}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "${{ steps.ver.outputs.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/transit.exe, LICENSE-MIT, LICENSE-APACHE, NOTICE $d
          $audio = if ("${{ matrix.asio }}" -eq "true") {
            "- Audio: ASIO and native WASAPI are included, plus the standard WASAPI host."
          } else {
            "- Audio is WASAPI only; this build has no ASIO support (an ASIO build is published beside it)."
          }
          @"
          transit for Windows (pre-alpha)

          $audio
          - The program is unsigned. If SmartScreen blocks it, click "More info", then "Run anyway".
          - Settings and logs: %APPDATA%\transit (set TRANSIT_CONFIG_DIR to change).
          - Based on SoundCraft by storytold: https://github.com/storytold/soundcraft
          "@ | Set-Content -Encoding utf8 "$d/README-WINDOWS.txt"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          d="${{ steps.ver.outputs.name }}"
          mkdir "$d"
          cp target/release/transit LICENSE-MIT LICENSE-APACHE NOTICE "$d"
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf '%s\n' 'transit for macOS (pre-alpha, Apple silicon)' '' \
              'Unsigned and not notarized (ad-hoc only). Run: xattr -dr com.apple.quarantine transit' \
              'or right-click the file and choose Open the first time.' > "$d/README-MACOS.txt"
          fi
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: |
            transit-*.zip
            transit-*.tar.gz

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: true
          generate_release_notes: true
