# Builds transit for Windows, macOS and Linux and attaches the archives to the GitHub Release for
# the tag. Linux is unsigned; Windows is unsigned unless the optional signing secrets are set
# (docs/releasing.md). macOS ships transit.app on a DMG (packaging/macos/package.sh),
# ad-hoc signed unless the optional signing secrets are set (docs/releasing.md), plus a tarball with
# the bare binary and the bench harness. Windows ships one zip and one MSI (packaging/windows/transit.wxs):
# transit-<ver>-windows-x86_64 (native WASAPI and native ASIO). The cpal ASIO host needs the Steinberg
# ASIO SDK and is build-only, never released (docs/building.md). Every archive also carries the audio-bench
# harness and BENCH-README.txt so testers can measure their interfaces without building.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, features: "--features transit/native-wasapi,transit/native-asio,audio-bench/native-wasapi,audio-bench/native-asio" }
          - { name: macos-arm64, os: macos-14 }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
        shell: bash
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
      # One invocation builds the app and the audio-bench harness (shipped in every archive) so the
      # shared crates compile once with one feature set.
      - name: Build
        run: cargo build -p transit -p audio-bench --release ${{ matrix.features }}
      - name: Package version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "name=transit-${v}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      # The MSI is built from packaging/windows/transit.wxs (WiX v5; the .wxs uses the v4 schema, which
      # the v3 toolset preinstalled on windows-latest cannot compile). The numeric MSI version is the
      # tag without "v" and without any pre-release suffix (v0.2.0 is 0.2.0, v0.1.0-alpha.1 is
      # 0.1.0); the full tag is recorded in the installer's comments and in HKLM\Software\transit.
      # Optional signing: with WINDOWS_CERTIFICATE_PFX (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD
      # set, sign.ps1 signs transit.exe, audio-bench.exe (before they go into the MSI and the zip)
      # and the MSI with signtool; without them it logs "unsigned" and the build continues.
      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $full = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $full = $null
            $inPkg = $false
            foreach ($line in Get-Content Cargo.toml) {
              if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
              if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $full = $Matches[1]; break }
            }
          }
          $msiVersion = ($full -split '-')[0]
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$') { throw "version '$full' does not map to an MSI major.minor.build version" }
          Write-Output "MSI version $msiVersion (full version $full)"
          ./packaging/windows/sign.ps1 target/release/transit.exe target/release/audio-bench.exe
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $msi = "${{ steps.ver.outputs.name }}.msi"
          wix build packaging/windows/transit.wxs -arch x64 `
            -d "Version=$msiVersion" -d "FullVersion=$full" -d "BinDir=$PWD/target/release" `
            -d "IconPath=$PWD/assets/app-icon/transit.ico" -o $msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }
          Remove-Item -Force -ErrorAction SilentlyContinue ([IO.Path]::ChangeExtension($msi, '.wixpdb'))
          ./packaging/windows/sign.ps1 $msi
          Get-Item $msi | Format-Table Name, Length
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "${{ steps.ver.outputs.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/transit.exe, target/release/audio-bench.exe, LICENSE-MIT, LICENSE-APACHE, NOTICE $d
          $bench = @"
          audio-bench: measure your interface (round trip, jitter, xruns)

          1. Cable one output of your interface to one of its inputs (or use its loopback input).
             Keep input gain at unity or lower, no phantom power, monitors low (a click plays).
          2. Close other audio programs. In this folder, list devices first:
               .\audio-bench.exe --list-devices --system WASAPI
          3. Run the loopback test (add --seconds 120 for a baseline). cpal, Windows audio:
               .\audio-bench.exe --backend cpal --system WASAPI --device "<output>" --in-device "<input>" --period 64 --seconds 60 --loopback --out-ch 1 --in-ch 1
             Native WASAPI:
               .\audio-bench.exe --backend wasapi --loopback --seconds 60 --out-device "<output>" --in-device "<input>"
          Native ASIO (the interface's ASIO driver; use the driver name --list-devices --system ASIO prints):
            .\audio-bench.exe --backend asio --device "<ASIO driver>" --loopback --seconds 60 --out-ch 1 --in-ch 1
          Do not pass --settings unless you are calibrating transit on this machine.
          "No click detected" means a wrong cable, channel or level.
          Send the table row and the backend lines via the measurement issue template:
          https://github.com/derekmwright/transit/issues/new/choose
          "@
          $bench | Set-Content -Encoding utf8 "$d/BENCH-README.txt"
          @"
          transit for Windows (pre-alpha)

          - Audio: native WASAPI and native ASIO are included, plus the standard WASAPI host.
          - Install: run the .msi (the installer, with the Start Menu shortcut and .transit/.transitz file associations). This zip is the portable form: unzip and run transit.exe.
          - The program and the installer are unsigned. If SmartScreen blocks them, click "More info", then "Run anyway".
          - Settings and logs: %APPDATA%\transit (set TRANSIT_CONFIG_DIR to change).
          - audio-bench.exe and BENCH-README.txt measure your interface; see that file.
          - Forked from SoundCraft by storytold (October 2026): https://github.com/storytold/soundcraft

          ASIO is a trademark of Steinberg Media Technologies GmbH, registered in Europe and other countries.
          "@ | Set-Content -Encoding utf8 "$d/README-WINDOWS.txt"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      # Optional: with all five secrets set, import the Developer ID certificate into a temporary
      # keychain and hand its identity to package.sh, which signs (hardened runtime, entitlements),
      # notarizes with notarytool --wait and staples. Without them package.sh signs ad hoc.
      - name: Import signing certificate (macOS, optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "Signing secrets not all set: skipping signing and notarization (ad-hoc signed DMG)."
            exit 0
          fi
          kc="$RUNNER_TEMP/transit-signing.keychain-db"
          kcpw="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "MACOS_KEYCHAIN=$kc"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "APPLE_PASSWORD=$APPLE_APP_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing with: $identity (notarization on)"
      # transit.app on a drag-to-Applications DMG. package.sh builds the aarch64 binary itself (a second,
      # app-only compile), signs inside-out, verifies, and notarizes and staples when the step above
      # exported the credentials. The bare-binary tarball below stays: it carries audio-bench.
      - name: Package transit.app DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export TRANSIT_VERSION="${GITHUB_REF_NAME#v}"; fi
          chmod +x packaging/macos/package.sh
          DIST="$PWD/dist-dmg" packaging/macos/package.sh --arch aarch64
          cp dist-dmg/transit-v*-macos-arm64.dmg .
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          d="${{ steps.ver.outputs.name }}"
          mkdir "$d"
          cp target/release/transit target/release/audio-bench LICENSE-MIT LICENSE-APACHE NOTICE "$d"
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf '%s\n' 'transit for macOS (pre-alpha, Apple silicon)' '' \
              'The matching .dmg release asset holds transit.app: open it and drag transit to Applications.' \
              'This tarball holds the bare binary and the audio-bench harness.' '' \
              'Unsigned (ad-hoc signed only) unless the release notes say notarized. If macOS refuses to open it, run:' \
              '  xattr -dr com.apple.quarantine /Applications/transit.app   (the app from the DMG)' \
              '  xattr -dr com.apple.quarantine transit                     (the bare binary here)' \
              'or right-click the app or file and choose Open the first time.' > "$d/README-MACOS.txt"
          fi
          cat > "$d/BENCH-README.txt" <<'EOF'
          audio-bench: measure your interface (round trip, jitter, xruns)

          1. Cable one output of your interface to one of its inputs (or use its loopback input).
             Keep input gain at unity or lower, no phantom power, monitors low (a click plays).
          2. Close other audio programs. In this folder, list devices first:
               ./audio-bench --list-devices
          3. Run the loopback test (add --seconds 120 for a baseline):
               ./audio-bench --backend cpal --device "<output>" --in-device "<input>" --period 64 --seconds 60 --loopback --out-ch 1 --in-ch 1

          Do not pass --settings unless you are calibrating transit on this machine.
          "No click detected" means a wrong cable, channel or level.
          Send the table row and the backend lines via the measurement issue template:
          https://github.com/derekmwright/transit/issues/new/choose
          EOF
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: |
            transit-*.zip
            transit-*.msi
            transit-*.tar.gz
            transit-*.dmg

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            macOS: the `.dmg` holds `transit.app`; open it and drag transit to Applications. The app is unsigned (ad-hoc signed only) unless these notes say notarized. If macOS blocks it, run `xattr -dr com.apple.quarantine /Applications/transit.app` (or right-click the app and choose Open). The `.tar.gz` holds the bare binary and `audio-bench`; the same command applies to the binary.

            Windows: the `.msi` installs transit and `audio-bench.exe` to Program Files (per-machine, needs administrator approval), with a Start Menu shortcut and the `.transit` and `.transitz` file associations; the `.zip` is the portable form. Both are unsigned unless these notes say signed: SmartScreen will warn, so click "More info", then "Run anyway".

            Each archive also carries `audio-bench` and `BENCH-README.txt`: cable an output to an input and measure your interface without building anything.
            - windows-x86_64: transit with native WASAPI and native ASIO; `audio-bench.exe` with native WASAPI, native ASIO and cpal WASAPI.
            - macos-arm64: `audio-bench` (cpal, Core Audio), in the tarball only, not in the DMG.
            - linux-x86_64: `audio-bench` (cpal, ALSA).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
