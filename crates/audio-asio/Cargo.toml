[package]
name = "transit-audio-asio"
description = "transit native ASIO backend: hand-written IASIO bindings, a dedicated STA host thread, driver listing and open/close (ADR 0016 amendment, draft); empty off 64-bit Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# No ASIO SDK, no C++ and no bindgen: the IASIO ABI is declared in `src/abi.rs`.
[target.'cfg(all(windows, target_pointer_width = "64"))'.dependencies]
transit-audio-backend.workspace = true
log.workspace = true
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# ADR 0013 and the draft native-ASIO amendment: this crate may contain `unsafe` for COM, the
# registry, the host thread's window and the IASIO vtable, all in `src/com.rs`. Every `unsafe`
# block carries a `// SAFETY:` comment stating the invariant and the thread. The rest mirrors
# `[workspace.lints]` and `crates/audio-wasapi`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
