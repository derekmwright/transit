[package]
name = "soundcraft-playback"
description = "transit audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
transit-audio-backend.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
transit-rt.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-asio-panel.workspace = true
log.workspace = true
serde.workspace = true
rtrb.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
triple_buffer.workspace = true
transit-midi-io.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Backend startup owns registration and release; never promote from the data callback.
cpal = { workspace = true, features = ["audio_thread_priority"] }

[target.'cfg(windows)'.dependencies]
# The native WASAPI backend (ADR 0016), behind the `native-wasapi` feature.
transit-audio-wasapi = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# Device-free callback probes used only by dependent crates' tests.
test-hooks = []
# The native WASAPI render backend (ADR 0016 slice c): the "Native WASAPI (experimental)" choice in
# Audio Devices. Off by default; without it the choice is not offered and `Backend::NativeWasapi` opens cpal.
native-wasapi = ["dep:transit-audio-wasapi"]
# ASIO on Windows (cpal's ASIO host). Off by default: building it downloads Steinberg's ASIO SDK
# (its own licence) and needs LLVM (libclang) for the bindings. `cargo build -p soundcraft --features asio`.
asio = ["cpal/asio", "soundcraft-asio-panel/asio"]

[dev-dependencies]
transit-rt = { workspace = true, features = ["testing"] }
serde_json.workspace = true
soundcraft-midi.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
transit-midi-io = { workspace = true, features = ["fake"] }

[lints]
workspace = true
