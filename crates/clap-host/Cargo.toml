[package]
name = "soundcraft-clap-host"
description = "transit CLAP plugin host: scans, loads and runs third-party CLAP plugins behind the safe soundcraft-dsp Plugin trait (the only crate with unsafe code)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-dsp.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true

# The Windows host window for embedded editors (a top-level HWND the plugin parents its GUI in).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "editor_main_thread"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json.workspace = true
clap-sys = "0.5"
libloading = "0.8"

# The isolated unsafe helper crate (craftrules never-crash): this crate opts out of the workspace
# `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere and allows it solely on the
# FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Test-only hook in the scan (see tests/registry_race.rs); off in every normal build.
[features]
test-hooks = []

# Turns the hook on for this crate's own tests.
[dev-dependencies]
soundcraft-clap-host = { path = ".", features = ["test-hooks"] }
