# A tiny VST3 plugin used only by soundcraft-vst3-host's integration tests. Not part of the
# SoundCraft workspace (the empty [workspace] table makes it its own root); the test builds it
# with `cargo build` and loads the resulting library. Never shipped.
[package]
name = "vst3-fixture"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vst3 = "=0.3.0"

[features]
# Builds a binary that lists only the sidechain plug-ins (ADR 0015 slice c, see src/lib.rs).
sidechain = []
# Fixture Synth takes 500 ms (or VST3_FIXTURE_CREATE_MS) to create, like a plug-in with a heavy
# library (backlog 12).
slow-create = []

[workspace]
