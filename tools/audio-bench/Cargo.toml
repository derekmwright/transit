[package]
name = "audio-bench"
description = "Audio backend benchmark harness (ADR 0016 slice b): callback jitter, achieved period, xruns and loopback round trip through the backend trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Measure the ASIO host on Windows (see `soundcraft-playback`'s `asio` feature for its build needs).
asio = ["soundcraft-playback/asio", "dep:asio-sys"]

# `--backend wasapi`: the native WASAPI backend (ADR 0016 slice c), Windows only.
native-wasapi = ["dep:transit-audio-wasapi"]

# `--backend asio`: the native ASIO backend (draft ADR 0016 amendment, ASIO slice b), 64-bit
# Windows only. No ASIO SDK and no LLVM: unlike `asio` (cpal's host), it builds like the rest.
native-asio = ["dep:transit-audio-asio"]

[dependencies]
serde_json.workspace = true
transit-audio-backend.workspace = true
soundcraft-playback.workspace = true

[target.'cfg(windows)'.dependencies]
# The same asio-sys cpal uses; `--list-devices` asks it why a registered driver is not listed.
asio-sys = { version = "0.2", optional = true }
transit-audio-wasapi = { workspace = true, optional = true }
transit-audio-asio = { workspace = true, optional = true }

[dev-dependencies]
transit-rt = { workspace = true, features = ["testing"] }

[lints]
workspace = true
